version: "3.8"

# ============================================================
# ELK Stack for Healthcare Microservices — Local Testing
# Usage: docker compose -f docker-compose.yml -f docker-compose-elk.yml up -d
# ============================================================

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: elasticsearchCont
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - microservices
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 30s
      timeout: 10s
      retries: 5

  logstash:
    image: docker.elastic.co/logstash/logstash:8.12.0
    container_name: logstashCont
    ports:
      - "5044:5044"
      - "9600:9600"
    networks:
      - microservices
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
    depends_on:
      - elasticsearch
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx512m

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: kibanaCont
    ports:
      - "5601:5601"
    networks:
      - microservices
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - xpack.security.enabled=false

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.12.0
    container_name: filebeatCont
    user: root
    networks:
      - microservices
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - logstash
    command: filebeat -e -strict.perms=false

  vault:
    image: hashicorp/vault:1.15
    container_name: vaultCont
    ports:
      - "8200:8200"
    networks:
      - microservices
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=root
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    command: vault server -dev

networks:
  microservices:

volumes:
  elasticsearch-data:
