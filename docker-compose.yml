

services:
  eureka-server:
    image: paragrider1/service-registry
    build: ./ServiceRegistry
    container_name: eureka-serverCont
    ports:
      - "8761:8761"
    networks:
      - microservices
    environment:
      - eureka.instance.hostname=eureka-server
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx256m -XX:+UseSerialGC


  api-gateway:
    image: paragrider1/api-gateway
    build: ./ApiGateway
    container_name: api-gatewayCont
    ports:
      - "8765:8765"
    networks:
      - microservices
    depends_on:
      - eureka-server
    environment:
      - eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx256m -XX:+UseSerialGC


#
  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmqCont
    ports:
      - "15672:15672" # RabbitMQ management console
      - "5672:5672" # RabbitMQ messaging
    networks:
      - microservices
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest

  mysql:
    image: mysql:5.7
    container_name: mysql
    environment:
      #      MYSQL_DATABASE: patientdb
      MYSQL_ROOT_PASSWORD: admin
      # Root password for MySQL
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - microservices
  #    healthcheck:
  #      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
  #      interval: 10s
  #      timeout: 5s
  #      retries: 5

  # Patient Service (Microservice)
  patient-service:
    image: paragrider1/patient-service
    build: ./PatientService
    container_name: patient-serviceCont
    ports:
      - "8081:8081"
    networks:
      - microservices
    depends_on:
      - eureka-server # Ensure Eureka is up before starting this service
      - api-gateway
      - mysql
    #    healthcheck:
    #      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
    #      interval: 10s
    #      timeout: 5s
    #      retries: 5
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/patientdb
      - eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx256m -XX:+UseSerialGC

  #    environment:
  #      - eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka  # Point to Eureka server

  # Doctor Service (Microservice)
  doctor-service:
    image: paragrider1/doctor-service
    build: ./DoctorService
    container_name: doctor-serviceCont
    ports:
      - "8082:8082"
    networks:
      - microservices
    #    healthcheck:
    #      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
    #      interval: 10s
    #      timeout: 5s
    #      retries: 5
    depends_on:
      - eureka-server
      - mysql
      - api-gateway
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/doctordb
      - eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx256m -XX:+UseSerialGC

  #    environment:
  #      - eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka  # Point to Eureka server

  # Appointment Service (Microservice)
  appointment-service:
    image: paragrider1/appointment-service
    build: ./AppointmentService
    container_name: appointment-serviceCont
    ports:
      - "8083:8083"
    networks:
      - microservices
    #    healthcheck:
    #      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
    #      interval: 10s
    #      timeout: 5s
    #      retries: 5
    depends_on:
      - mysql
      - rabbitmq
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/appointmentdb
      - eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka
      - SPRING_RABBITMQ_HOST=rabbitmq # Use the service name 'rabbitmq' as the hostname
      - SPRING_RABBITMQ_PORT=5672
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx256m -XX:+UseSerialGC
  #      mysql:
  #        condition: service_healthy
  #      - rabbitmq

  #    environment:
  #      - eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka  # Point to Eureka server
  #      - SPRING_RABBITMQ_HOST=rabbitmq  # Use the service name 'rabbitmq' as the hostname
  #      - SPRING_RABBITMQ_PORT=5672

  # Notification Service (Microservice)
  notification-service:
    image: paragrider1/notification-service
    build: ./NotificationService
    container_name: notification-serviceCont
    ports:
      - "8085:8085"
    networks:
      - microservices
    depends_on:
      - appointment-service

    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq # Use the service name 'rabbitmq' as the hostname
      - SPRING_RABBITMQ_PORT=5672
      - eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx256m -XX:+UseSerialGC
  #    environment:
#      - eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka  # Point to Eureka server

  # Frontend Service (Next.js)
  frontend:
    image: paragrider1/healthcare-frontend
    build:
      context: ./frontend
      args:
        - GATEWAY_URL=http://api-gateway:8765
    container_name: frontendCont
    ports:
      - "3001:3001"
    networks:
      - microservices
    depends_on:
      - api-gateway

networks:
  microservices:
    driver: bridge
  elk:
    driver: bridge

volumes:
  mysql-data:
  elasticsearch-data:
# NOTE: ELK services are in docker-compose-elk.yml
# Run with: docker compose -f docker-compose.yml -f docker-compose-elk.yml up -d
