input {
  beats {
    port => 5044
  }
}

filter {
  if [container][name] =~ "patient|doctor|appointment|notification|gateway|eureka" {
    mutate {
      add_field => { "service" => "%{[container][name]}" }
      add_field => { "application" => "healthcare-microservices" }
    }
  }

  grok {
    match => {
      "message" => "%{TIMESTAMP_ISO8601:timestamp}\s+%{LOGLEVEL:log_level}\s+%{DATA:logger}\s+-\s+%{GREEDYDATA:log_message}"
    }
    overwrite => [ "message" ]
    tag_on_failure => ["_grokparsefailure_spring"]
  }

  date {
    match => [ "timestamp", "ISO8601" ]
    target => "@timestamp"
    remove_field => [ "timestamp" ]
  }

  mutate {
    remove_field => ["agent", "ecs", "input"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "healthcare-logs-%{+YYYY.MM.dd}"
  }
  stdout {
    codec => rubydebug
  }
}
