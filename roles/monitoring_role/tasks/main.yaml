- name: Apply Prometheus
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  command: kubectl apply -f "{{ playbook_dir }}/Kubernetes/prometheus.yml" --validate=false

- name: Apply Grafana
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  command: kubectl apply -f "{{ playbook_dir }}/Kubernetes/grafana.yml" --validate=false
